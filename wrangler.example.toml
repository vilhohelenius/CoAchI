# Copy to wrangler.toml (gitignored) and fill in. No real ids belong in this file.
name = "coachi"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["0 */6 * * *"] # watchdog

[[d1_databases]]
binding = "DB"
database_name = "coachi"
database_id = "<D1_DATABASE_ID>"

[[r2_buckets]]
binding = "FIT" # read-only use: detail/{id}.json for the activity page
bucket_name = "<R2_BUCKET>"

[vars]
ACCESS_TEAM_DOMAIN = "<team>.cloudflareaccess.com"
ACCESS_AUD = "<Access application AUD tag>"
GITHUB_REPO = "<owner>/<repo>"
GARMIN_KEY_EXPIRES = "YYYY-MM-DD"
PAT_EXPIRES = "YYYY-MM-DD"
# Secret, set with wrangler secret put: GITHUB_DISPATCH_TOKEN
# Optional coach: secret ANTHROPIC_API_KEY (absent = coach off), vars COACH_MODEL (default claude-haiku-4-5-20251001), COACH_MONTHLY_USD_CAP (default 5)
# COACH_MONTHLY_USD_CAP = "5"

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true # all paths hit the Worker so Access is always checked
